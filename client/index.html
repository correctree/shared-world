<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090c12" />
  <title>Shared World Prototype 0.1</title>
</head>
<body>
  <canvas id="application-canvas"></canvas>

  <section id="lobby" class="panel">
    <div class="eyebrow">XR EDUCATION DEVELOPMENT</div>
    <h1>SHARED WORLD <span>0.1</span></h1>
    <p class="lead">同じ ROOM CODE の参加者が、ひとつの3D空間を共有します。</p>

    <label>NAME
      <input id="nameInput" maxlength="16" value="Ken" autocomplete="off" />
    </label>
    <label>ROOM CODE
      <input id="roomInput" maxlength="16" value="ART001" autocomplete="off" />
    </label>
    <button id="enterButton">ENTER WORLD</button>
    <p id="status">サーバー未接続</p>
  </section>

  <section id="hud" class="hud hidden">
    <div><strong>SHARED WORLD 0.1</strong></div>
    <div id="roomLabel">ROOM —</div>
    <div id="playersLabel">PLAYERS 0 / 4</div>
    
    <div class="controls">WASD / 矢印キー：移動</div>
  </section>

   <button id="addArtworkButton" type="button">
    + ADD ARTWORK
  </button>

  <!-- Prototype 0.9 / Add Artwork Panel -->
<section id="addArtworkPanel" class="artwork-panel hidden">

  <div class="artwork-panel-header">
    <strong>ADD ARTWORK</strong>
    <button id="closeArtworkPanel" type="button" aria-label="Close">
      ×
    </button>
  </div>

  <div class="artwork-panel-body">

    <div class="artwork-label">
      MEDIA TYPE
    </div>

    <div class="artwork-media-buttons">
      <button
        id="webmArtworkMode"
        class="artwork-media-button active"
        type="button"
      >
        TRANSPARENT WEBM
      </button>

      <button
        id="spriteArtworkMode"
        class="artwork-media-button"
        type="button"
      >
        SPRITE SHEET
      </button>
    </div>

    <input
      id="artworkFileInput"
      type="file"
      accept=".webm,.png,.json,.zip"
      hidden
    />

    <button id="selectArtworkFile" type="button">
      SELECT FILE
    </button>

    <div id="artworkFileName">
      NO FILE SELECTED
    </div>

  </div>

  <div class="artwork-panel-footer">

  <button
    id="cancelArtworkButton"
    type="button"
  >
    CANCEL
  </button>

  <button
    id="addArtworkToWorldButton"
    type="button"
    disabled
  >
    ADD TO WORLD
  </button>

</div>

</section>
  
  <!-- Mobile virtual joystick -->
<div id="joystick">
  <div id="joystickKnob"></div>
</div>
<button id="viewToggle">1ST</button>  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
